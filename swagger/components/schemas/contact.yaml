type: object
required:
  - name
  - phoneNumber
  - contactType
properties:
  _id:
    description: "Contact's id"
    type: string
    example: 68e8b9fd4dd19326e6854b94
  name:
    description: "Contact's name"
    type: string
    example: 'John Doe'
  phoneNumber:
    description: "Contact's phone number"
    type: number
    example: +380000000010
  email:
    description: "Contact's email"
    type: string
    example: 'parent@hgmail.com'
  isFavourite:
    description: 'Whether is contact favourite'
    type: boolean
    example: false
  contactType:
    description: "Contact's type"
    type: string
    enum: ['work', 'home', 'personal']
  userId:
    description: "Contact's user id"
    type: string
    example: 68e64114ae3d50dd53b9dcce
  photo:
    description: "Link to contact's photo"
    type: string
    example: https://res.cloudinary.com/dz55ayfg7/image/upload/v1760085127/jiaefo5cclotgqgnpkwn.jpg
  createdAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
  updatedAt:
    type: string
    format: date-time
    example: 2025-10-08T18:21:10.157+00:00
